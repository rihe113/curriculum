<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TODOリスト</title>

    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-cyan-100 flex justify-center items-center min-h-screen">

    <div class="bg-white p-8 rounded-lg shadow-lg text-center">
        <h1 class="text-3xl font-bold text-cyan-700 mb-5">TODOリスト</h1>

        <input
            type="text"
            id="taskInput"
            placeholder="タスクを入力"
            class="border border-cyan-500 rounded px-3 py-2 w-64"
        >

        <button
            id="addButton"
            class="bg-cyan-600 text-white px-4 py-2 rounded ml-2 hover:bg-cyan-700"
        >
            追加
        </button>

        <ul id="todoList" class="mt-5 space-y-2"></ul>
    </div>

    <script>
        const taskInput = document.querySelector("#taskInput");
        const addButton = document.querySelector("#addButton");
        const todoList = document.querySelector("#todoList");

        addButton.addEventListener("click", () => {
            const text = taskInput.value.trim();

            if (text === "") {
                return;
            }

            const li = document.createElement("li");
            li.className = "flex justify-center items-center gap-2";

            const span = document.createElement("span");
            span.textContent = text;

            const completeButton = document.createElement("button");
            completeButton.textContent = "完了";
            completeButton.className = "bg-green-500 text-white px-2 py-1 rounded";

            completeButton.addEventListener("click", () => {
                span.classList.toggle("line-through");
                span.classList.toggle("text-gray-500");
            });

            const deleteButton = document.createElement("button");
            deleteButton.textContent = "削除";
            deleteButton.className = "bg-red-500 text-white px-2 py-1 rounded";

            deleteButton.addEventListener("click", () => {
                if (confirm("このタスクを削除しますか？")) {
                    li.remove();
                }
            });

            li.appendChild(span);
            li.appendChild(completeButton);
            li.appendChild(deleteButton);

            todoList.appendChild(li);

            taskInput.value = "";
        });
    </script>

</body>
</html>
