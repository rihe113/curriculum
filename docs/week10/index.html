<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>GitHubユーザー検索</title>
</head>

<body class="bg-gray-100 min-h-screen flex items-center justify-center">

    <div class="bg-white p-6 rounded-lg shadow-md w-full max-w-md">
        <h1 class="text-2xl font-bold mb-4">
            GitHubユーザー検索
        </h1>

        <input id="username" type="text" placeholder="GitHubユーザー名" class="w-full border p-2 rounded mb-3">

        <button id="search-button" class="w-full bg-blue-500 text-white p-2 rounded">
            検索
        </button>

        <div id="result" class="mt-6"></div>
    </div>

    <script>
        const usernameInput = document.getElementById("username");
        const searchButton = document.getElementById("search-button");
        const result = document.getElementById("result");

        searchButton.addEventListener("click", async function () {
            const username = usernameInput.value;

            try {
                const response = await fetch(
                    `https://api.github.com/users/${username}`
                );

                if (!response.ok) {
                    result.textContent = "ユーザーが見つかりませんでした";
                    return;
                }

                const data = await response.json();

                console.log(data);

                result.innerHTML = `
    <img
        src="${data.avatar_url}"
        alt="${data.name}"
        class="w-24 h-24 rounded-full mx-auto"
    >

    <h2 class="text-xl font-bold text-center mt-3">
        ${data.name}
    </h2>

    <p class="mt-3">
        ${data.bio}
    </p>

    <p class="mt-3">
        フォロワー数：${data.followers}
    </p>
    `;
            } catch (error) {
                result.textContent = "通信に失敗しました";
                console.error(error);
            }
        });

    </script>
</body>

</html>
